name: Release

# Publishes a multi-architecture image to Docker Hub and GHCR when a v* tag is pushed.
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (an access token, not
# your password). GHCR uses the built-in GITHUB_TOKEN.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.0-beta.1 (no image is pushed)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write        # keyless cosign signing

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mobsf-mcp
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Never publish something whose tests have not passed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and tags
        id: version
        run: |
          version="${{ github.event.inputs.version }}"
          [ -z "$version" ] && version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          pom=$(grep -m1 -oP '(?<=<version>)[^<]+' <(sed -n '/<artifactId>mobsf-mcp<\/artifactId>/,+2p' pom.xml))
          if [ "$pom" != "$version" ]; then
            echo "pom.xml version ($pom) does not match the tag ($version)"; exit 1
          fi

          # A semver pre-release (1.0.0-beta.1, 2.0.0-rc.1) must never become :latest —
          # `docker pull <image>` with no tag has to keep giving people a stable build.
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<TAGS_EOF"
            echo "${DOCKERHUB_IMAGE}:${version}"
            echo "${GHCR_IMAGE}:${version}"
            if [ "$prerelease" = "true" ]; then
              # moving floating tag for pre-releases, so testers can follow the beta line
              echo "${DOCKERHUB_IMAGE}:beta"
              echo "${GHCR_IMAGE}:beta"
            else
              echo "${DOCKERHUB_IMAGE}:latest"
              echo "${GHCR_IMAGE}:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing $version (pre-release: $prerelease)"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on a tag)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          tags: ${{ steps.version.outputs.tags }}

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign both images (keyless)
        if: github.event_name == 'push'
        run: |
          cosign sign --yes "${DOCKERHUB_IMAGE}@${DIGEST}"
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Smoke test the published image
        if: github.event_name == 'push'
        run: |
          docker run --rm "${DOCKERHUB_IMAGE}:${{ steps.version.outputs.version }}" --transport=nonsense \
            && { echo "expected a non-zero exit for an invalid transport"; exit 1; } \
            || echo "invalid transport rejected as expected"

      - name: Create the GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body: |
            Images:
            - `docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}`
            - `docker pull ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}`

            ${{ steps.version.outputs.prerelease == 'true' && 'This is a pre-release: it is tagged `beta`, and `latest` still points at the previous stable release.' || 'Tagged `latest`.' }}

            Verify the signature:
            ```
            cosign verify ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }} \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

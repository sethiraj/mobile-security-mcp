name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check SPDX license headers
        run: |
          missing=$(grep -L "SPDX-License-Identifier: MIT" $(find src -name '*.java') || true)
          if [ -n "$missing" ]; then
            echo "Missing '// SPDX-License-Identifier: MIT' header in:"; echo "$missing"; exit 1
          fi

      - name: Build and test (unit + stdio/HTTP integration)
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  # Runs the published compose stack (official MobSF + this server) and scans a real app.
  compose-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment and test app
        run: |
          sed -e "s/^MOBSF_API_KEY=.*/MOBSF_API_KEY=$(openssl rand -hex 24)/" \
              -e "s/^MCP_AUTH_TOKEN=.*/MCP_AUTH_TOKEN=$(openssl rand -hex 16)/" .env.example > .env
          mkdir -p apks reports
          # Minimal Android source project; MobSF scans it as a source-code zip.
          mkdir -p testapp/app/src/main/java/com/example/vuln
          cp docs/testapp/AndroidManifest.xml testapp/app/src/main/
          cp docs/testapp/MainActivity.java testapp/app/src/main/java/com/example/vuln/
          (cd testapp && jar cfM ../apks/vulndemo-src.zip .)   # jar, not zip: forward-slash entries

      - name: Start MobSF + mobsf-mcp
        run: docker compose up -d --build --wait

      - name: Smoke test through MCP (includes report schema validation)
        run: bash scripts/smoke-test.sh vulndemo-src.zip

      - name: CI scan script, gate disabled (the test app is deliberately insecure)
        run: MAX_HIGH=-1 bash scripts/ci-scan.sh /data/apks/vulndemo-src.zip

      - name: Validate the SARIF export against the official SARIF schema
        run: |
          curl -sL -o /tmp/sarif-schema.json https://json.schemastore.org/sarif-2.1.0.json
          sarif=$(ls reports/*/static.sarif.json | head -1)
          npx --yes -p ajv-cli@5 -p ajv-formats@2 ajv validate -c ajv-formats --strict=false \
            -s /tmp/sarif-schema.json -d "$sarif"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

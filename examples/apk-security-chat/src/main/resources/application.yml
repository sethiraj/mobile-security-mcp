spring:
  application:
    name: apk-security-chat
  threads:
    virtual:
      enabled: true

  ai:
    # Azure AI Foundry serves the OpenAI API, so the OpenAI client reaches it with nothing
    # but a different base URL. AZURE_AI_BASE_URL is the resource endpoint up to and
    # including /openai/v1; the deployment name goes in `model`, and for an Anthropic
    # deployment that is the name you gave it in Foundry, e.g. claude-sonnet-5.
    openai:
      api-key: ${AZURE_AI_API_KEY}
      base-url: ${AZURE_AI_BASE_URL}
      chat:
        options:
          model: ${AZURE_AI_DEPLOYMENT:claude-sonnet-5}
          temperature: 0.2

    mcp:
      client:
        name: apk-security-chat
        type: SYNC
        # A dynamic scan blocks for minutes, so the default 20s is far too short.
        request-timeout: 20m
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            mobsf:
              url: ${MOBSF_MCP_URL:http://localhost:8090}
              endpoint: /mcp

# The bearer token mobsf-mcp requires in HTTP mode. Same value as MCP_AUTH_TOKEN in the
# repository root .env. Applied by ChatConfig#mobsfAuthorization.
mobsf:
  mcp:
    auth-token: ${MCP_AUTH_TOKEN:}

appium:
  server-url: ${APPIUM_URL:http://127.0.0.1:4723}
  # Must be the device MobSF is analysing: check `adb devices`.
  device-name: ${APPIUM_DEVICE:emulator-5554}
  command-timeout: 120s

server:
  port: ${PORT:8099}

logging:
  level:
    io.mobsfmcp.example: INFO
    org.springframework.ai: INFO
